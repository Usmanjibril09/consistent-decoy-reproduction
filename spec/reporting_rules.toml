# Reporting rules for tables, figures and manuscript (D60). Fixed before 05_statistics.py is run.
# Reporting only: no endpoint, test, setting or method is defined or changed here.

[ablation]
source = "results/phase3/ablation/ablation.tsv"
variants = ["Full", "A1", "A2", "A3", "A3-bare", "A4", "A5"]
labels = { Full = "C1-Full", A1 = "C1-A1 (no C2)", A2 = "C1-A2 (no C3)", A3 = "A3-L (no command conditioning, C2/C3 on; protocol 4)", A3-bare = "A3 (no command conditioning, no layers)", A4 = "C1-A4 (C2 limits only)", A5 = "C1 (C1 only; former B9, D27(f))" }
m1_attacks = ["A103", "A105", "A110", "A203", "A205", "A207", "A209", "A212", "A216", "A218"]
m1_rule = "M1 = mean over the 10 attacks of metrics/fit/p_real_m1/<attack> (each a mean over training seeds 0-4); HAI only"

[ablation.columns]
hai = ["metrics/fit/normal", "metrics/fit/crosstime/pooled", "metrics/cfid", "metrics/dtw/normal",
       "metrics/detector/p_syn/in/rate", "metrics/detector/p_syn/oor/rate", "seam/p_syn_oor/interior",
       "clf/mr/m2", "clf/rnn/m2", "simprocess/m2", "simprocess/m2b", "clf/tstr_mae"]
qappd = ["metrics/fit/normal", "metrics/fit/p_anom", "metrics/cfid", "metrics/dtw/normal", "metrics/dtw/p_anom",
         "metrics/detector/p_syn/in/rate", "metrics/detector/p_syn/oor/rate", "seam/p_syn_oor/interior",
         "clf/mr/m2", "clf/rnn/m2", "simprocess/m2", "clf/tstr_mae"]

[exclude]
qappd = ["simprocess/m2b", "simprocess/m2b_passing_only"]   # D43: M2b not applicable on QAPPD

[diagnostics]
read_from_source = ["simprocess pred p_real_psyn, p_real_test_decoy (results/phase3/simprocess/pred)",
                    "seam p_syn_oor first_step_median, first_within_lookback (results/phase3/seam/seam.json)"]
empty_entry_rule = "Empty (None) entries are reported as a count beside the mean of the numeric entries; never set to 0 or dropped silently. Endpoints M2b and P-syn flag rate already apply D45 (no passing sub-window = P(real) 0). Source: D59."

[notes]
detection_with_m1 = "A detection rate is never reported without M1/FIT beside it: A3-bare has 0 out-of-range hits on HAI while M1 is -18.10 (a decoy that ignores commands gives the flow rules nothing to check)."
layer_identities = "A2 = Full and A1 = A5 on held-out normal metrics are expected (C3 inactive on normal windows, stage 3c); state this, do not present as findings."
hai_oor_greybox = "On HAI out-of-range probes, layered outputs equal B3 (grey box) in detected windows (D54(d)); C3 hands over at weight 1."
qappd_detector_ceiling = "QAPPD physics-rule detection of learned decoys is at ceiling (YawDot interior 1.000, D54(b)); limitation, not artefact."
m1_attribution = "Averaged over 10 attacks most layered M1 gain over A5 comes from C2 (+13.9) not C3 (+2.6) (D58); C3 effects only per attack on A103/A105/A110/A205 under H3."
latency_b6 = "B6 latency is window time / H, footnoted 'per window, amortised', not ranked against step methods (D57)."
latency_b8l = "B8-L about 1.3% faster than B8 on QAPPD: timing noise, not interpreted (D57)."
d47_wording = "Use 'decoys are too smooth/regular over short windows' (D48 correction), not 'reproduce dynamics but not noise' (D47)."
